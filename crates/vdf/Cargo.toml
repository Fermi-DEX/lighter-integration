[package]
name = "vdf"
version = "0.1.0"
edition = "2021"
description = "Wesolowski VDF (Verifiable Delay Function) implementation"
license = "MIT OR Apache-2.0"

[dependencies]
# High-performance cryptographic arithmetic
crypto-bigint = { version = "0.5", features = ["serde", "rand_core"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.5", optional = true }

# CPU optimization features  
target-lexicon = "0.12"
chacha20poly1305 = "0.11.0"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
bench = ["criterion"]
fpga-hardware = []

[[bench]]
name = "vdf_bench"
harness = false
required-features = ["bench"]

[[bin]]
name = "tick_test"
path = "src/bin/tick_test.rs"

[[bin]]
name = "optimization_benchmark"
path = "src/bin/optimization_benchmark.rs"

[[bin]]
name = "fpga_test"
path = "src/bin/fpga_test.rs"
