[package]
name = "sequencer"
version = "0.1.0"
edition = "2021"
description = "Continuum sequencer core - transaction ordering and VDF tick production"

[dependencies]
vdf = { path = "../vdf" }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "6.1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
num-bigint = "0.4"
num-traits = "0.2"
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha3 = "0.12.0"
rand = "0.10.2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.0"
