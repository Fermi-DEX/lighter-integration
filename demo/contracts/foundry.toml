[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# BigMulMod uses inline Yul limb arithmetic; via-ir keeps the stack happy.
via_ir = true
fs_permissions = [
    { access = "read", path = "./vectors" },
    { access = "read-write", path = "./deployments" },
]
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
