[workspace]
resolver = "2"
members = [
    "crates/vdf",
    "crates/sequencer",
    "crates/continuum-lighter-plugin",
    "demo/gateway"
]

[workspace.dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
